# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    if: github.repository_owner == 'Novartis'
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::., any::roxygen2
          needs: website

      # OncoBayes2 ships a slim example-sampling roxygen template so CRAN
      # examples run fast. Swap in the full-sampling variant and regenerate the
      # Rd help pages so the website renders examples with the package default
      # sampling. Only the Rd roclet is run so NAMESPACE/collate are untouched.
      # No restore is needed: the checkout is ephemeral.
      - name: Render examples with full default sampling for the website
        run: |
          file.copy("man-roxygen/start-example-full.R", "man-roxygen/start-example.R", overwrite = TRUE)
          roxygen2::roxygenize(roclets = "rd")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
